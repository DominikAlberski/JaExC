[tools]
"cargo:https://github.com/WorksApplications/sudachi.rs" = { version = "tag:v0.7.0", crate = "sudachi-cli" }
"github:asciinema/asciinema" = "3.2.1"

[tasks."sudachi:dict"]
description = "Download the SudachiDict core dictionary to ~/.local/share/sudachi"
run = """
set -eu
dir="$HOME/.local/share/sudachi"
mkdir -p "$dir/dl"
curl -fsSL -o "$dir/dl/core.zip" https://d2ej7fkh96fzlu.cloudfront.net/sudachidict/v1/sudachi-dictionary-20261015-core.zip
unzip -o -j "$dir/dl/core.zip" -d "$dir"
"""
